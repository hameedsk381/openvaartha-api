# Websocket proxying for the live-updates connection (/api/v1/ws).
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream astro {
    server astro:4321;
}

upstream api {
    # Unique alias on Dokploy's shared network — a bare "api" host would
    # collide with other apps' services. Matches the alias set on the api
    # service in docker-compose.yml. (The upstream *name* below stays "api";
    # it's nginx-internal, so the proxy_pass directives need no change.)
    server openvaartha-8ud53n-api:8000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 15m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/xml image/svg+xml;
    gzip_min_length 1024;

    # Static assets from Astro build (immutable, long-cache)
    location /_astro/ {
        proxy_pass http://astro;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Video uploads: higher ceiling + longer timeouts
    location = /api/v1/upload/video {
        client_max_body_size 110m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_body_timeout 300s;
        proxy_pass http://api/api/v1/upload/video;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API calls → FastAPI backend (with WebSocket support)
    location /api/ {
        proxy_pass http://api/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Sitemap, robots, RSS, llms.txt → API backend
    location ~ ^/(sitemap\.xml|news-sitemap\.xml|robots\.txt|feed\.xml|feed/.+\.xml|llms\.txt|\.well-known/agents\.json)$ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location = /health {
        proxy_pass http://api/health;
        proxy_set_header Host $host;
    }

    # Media files
    location /media/ {
        alias /usr/share/nginx/html/media/;
        try_files $uri =404;
    }

    # Everything else → Astro SSR
    location / {
        proxy_pass http://astro;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers (Astro adds its own via middleware, but nginx
    # provides a safety net for any response it serves directly)
    add_header Content-Security-Policy "default-src 'self';script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com/gsi/client https://www.googletagmanager.com;style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style;font-src 'self' https://fonts.gstatic.com data:;img-src 'self' data: blob: https: https://www.googletagmanager.com;media-src 'self' https://storage.googleapis.com;connect-src 'self' https://accounts.google.com https://www.google-analytics.com https://analytics.google.com https://www.google.com;frame-src https://accounts.google.com;base-uri 'self';form-action 'self';object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
