<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Open Vaartha</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #f8f5f0;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .card {
      text-align: center;
      max-width: 400px;
    }
    .logo { font-size: 3rem; font-weight: 900; color: #550000; letter-spacing: -0.03em; }
    .logo span { color: #e8c48a; }
    h1 { margin-top: 1.5rem; font-size: 1.25rem; font-weight: 700; }
    p { margin-top: 0.75rem; font-size: 0.9rem; color: #666; line-height: 1.6; }
    .retry {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      background: #550000;
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .retry:hover { background: #7a0000; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Open<span>vaartha</span></div>
    <h1>You're offline</h1>
    <p>Check your connection and try again. Your saved stories and reading history will be available when you're back online.</p>
    <button class="retry" onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
