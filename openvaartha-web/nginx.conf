# Websocket proxying for the live-updates connection (/api/v1/ws). The map
# only sets "Connection: upgrade" when the client actually sent an Upgrade
# header; normal HTTP requests keep the default "close" so they aren't hijacked
# into an upgrade that was never requested.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    # Re-resolve the api/astro container IPs at request time instead of caching
    # them once at worker startup. Dokploy replaces containers on every deploy
    # (and on a restart) — putting the host in a $variable with Docker's
    # embedded DNS (127.0.0.11) forces per-request re-resolution and avoids 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend openvaartha-8ud53n-api;
    set $astro_backend openvaartha-8ud53n-astro;

    # Allow raw admin media uploads up to 15MB (video uploads override to 110MB below).
    client_max_body_size 15m;

    # Enable Gzip compression for text, JSON, and JS/CSS assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache compiled static Vite assets (used by /admin and /polls React routes)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # Cache static Astro build assets
    location /_astro/ {
        proxy_pass http://$astro_backend:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Cache PWA icons and brand static files served from the web bundle
    location ~* ^/(icon-[^/]+\.png|pwa-[^/]+\.png|logo\.[^/]+|og-image\.[^/]+|news-fallback\.svg|placeholder\.svg|offline\.html)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    location /thumbnails/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # React-only routes (/admin CMS and /polls) served by the Vite SPA bundle
    location ~ ^/admin(/.*)?$ {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location ~ ^/polls(/.*)?$ {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Author profile URLs appear in article JSON-LD, but no public author page
    # exists yet. Return a hard 404 instead of rendering a soft error.
    location ~ ^/authors/ {
        return 404;
    }

    # Serve uploaded media files directly from the shared volume
    location /media/ {
        alias /usr/share/nginx/html/media/;
        try_files $uri =404;
    }

    # Proxy sitemaps, robots, RSS feeds, llms.txt, and agents.json to the API
    location = /sitemap.xml {
        proxy_pass http://$api_backend:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /news-sitemap.xml {
        proxy_pass http://$api_backend:8000/news-sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://$api_backend:8000/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /feed.xml {
        proxy_pass http://$api_backend:8000/feed.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/feed/.+\.xml$ {
        proxy_pass http://$api_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms.txt {
        proxy_pass http://$api_backend:8000/llms.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/agents.json {
        proxy_pass http://$api_backend:8000/.well-known/agents.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct video uploads (admin CMS)
    location = /api/v1/upload/video {
        client_max_body_size 110m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_body_timeout 300s;
        proxy_pass http://$api_backend:8000/api/v1/upload/video;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API calls (including WebSocket /api/v1/ws) to the backend container
    location /api/ {
        proxy_pass http://$api_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Proxy health endpoint
    location /health {
        proxy_pass http://$api_backend:8000;
        proxy_set_header Host $host;
    }

    # Public website → Astro SSR
    location / {
        proxy_pass http://$astro_backend:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers for responses proxied from Astro and React /admin routes
    add_header Content-Security-Policy "default-src 'self';script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client https://www.googletagmanager.com;style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style;font-src 'self' https://fonts.gstatic.com data:;img-src 'self' data: blob: https: https://www.googletagmanager.com;media-src 'self' https://storage.googleapis.com;connect-src 'self' https://accounts.google.com https://www.google-analytics.com https://analytics.google.com https://www.google.com;frame-src https://accounts.google.com;base-uri 'self';form-action 'self';object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
