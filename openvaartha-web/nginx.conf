# Websocket proxying for the live-updates connection (/api/v1/ws). The map
# only sets "Connection: upgrade" when the client actually sent an Upgrade
# header; normal HTTP requests keep the default "close" so they aren't hijacked
# into an upgrade that was never requested.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    # nginx's silent default is 1MB — well under typical phone photos or
    # AI-generated images (2-8MB), so the admin thumbnail upload (POST /api/v1/upload/)
    # was failing with a 413 before ever reaching the FastAPI backend. GCS-side,
    # the backend recompresses every upload to WebP regardless of input size, so
    # this only bounds the raw upload, not storage cost.
    client_max_body_size 15m;

    # Enable Gzip compression for text, JSON, and JS/CSS assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache compiled static Vite assets (JS/CSS/fonts)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # Server-rendered article pages: proxy to the API so it injects per-article
    # <head> meta + a crawlable body shell into index.html. Must precede the
    # generic `location /` (regex locations take precedence over the prefix).
    location ~ ^/article/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Category landing pages: proxy to the API for per-category <head> meta
    # (distinct title/canonical/JSON-LD) + a crawlable headline list. Regex block
    # takes precedence over the generic `location /`.
    location ~ ^/category/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Author profile URLs appear in article JSON-LD, but no public author page
    # exists yet (the authors collection is empty). Return a hard 404 instead of
    # the 200 SPA shell, which Google was crawling and declining to index as a
    # thin duplicate. Server-level security headers still apply (no add_header
    # defined at this level), and a 404 tells Google to drop the URL entirely.
    location ~ ^/authors/ {
        return 404;
    }

    # Homepage: SSR head so the index page carries canonical + Organization/WebSite
    # JSON-LD and a crawlable latest list, replacing the stale static shell.
    location = / {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fixed SPA content routes that have dedicated head meta (trending, about,
    # privacy…): serve SSR head via the API instead of a title-less static shell.
    location ~ ^/(trending|explainers|bytes|about|contact|editorial|corrections|privacy|terms|search|login|register|forgot-password|reset-password)/?$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the static built frontend assets
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Security headers for responses nginx serves directly (static SPA + asset
    # fallbacks). The FastAPI middleware adds the same headers on proxied
    # routes; without a server-level block here, the SPA shell and static
    # files served by this container would lack CSP/X-Frame-Options/etc.
    add_header Content-Security-Policy "default-src 'self';script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client https://www.googletagmanager.com;style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style;font-src 'self' https://fonts.gstatic.com data:;img-src 'self' data: blob: https: https://www.googletagmanager.com;media-src 'self' https://storage.googleapis.com;connect-src 'self' https://accounts.google.com https://www.google-analytics.com https://analytics.google.com https://www.google.com;frame-src https://accounts.google.com;base-uri 'self';form-action 'self';object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Serve uploaded media files directly from the shared volume
    location /media/ {
        alias /usr/share/nginx/html/media/;
        try_files $uri =404;
    }

    # Proxy sitemap.xml to the backend API container
    location = /sitemap.xml {
        proxy_pass http://api:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy the Google News sitemap to the backend API container
    location = /news-sitemap.xml {
        proxy_pass http://api:8000/news-sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy robots.txt to the backend API container
    location = /robots.txt {
        proxy_pass http://api:8000/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy the full RSS feed to the backend API container
    location = /feed.xml {
        proxy_pass http://api:8000/feed.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy per-category RSS feeds to the backend API container
    location ~ ^/feed/.+\.xml$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy llms.txt to the backend API container
    location = /llms.txt {
        proxy_pass http://api:8000/llms.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy the AI agent discovery file to the backend API container
    location = /.well-known/agents.json {
        proxy_pass http://api:8000/.well-known/agents.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct video uploads (admin CMS): a much higher ceiling than the general
    # 15m default above, plus longer timeouts since a multi-minute video can
    # take a while to upload on a slow connection. Set a little above the
    # backend's own 100MB cap (app/api/v1/upload.py) so requests near that
    # boundary get the backend's descriptive JSON error, not nginx's plain 413.
    # Exact-match `location =` always outranks the `/api/` prefix block below,
    # regardless of declaration order.
    location = /api/v1/upload/video {
        client_max_body_size 110m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_body_timeout 300s;
        proxy_pass http://api:8000/api/v1/upload/video;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API calls to the backend container. The Upgrade/Connection headers
    # let /api/v1/ws WebSocket connections handshake through nginx; a plain
    # HTTP proxy (no Upgrade) makes every ws connection fail the initial
    # handshake, which Firefox surfaces as "connection refused".
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Proxy health endpoint
    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }
}
