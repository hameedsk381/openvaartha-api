name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      # Tests expect Mongo on localhost:27017 (see tests/conftest.py). Redis is
      # optional for the suite but provided so cache paths behave like prod.
      mongo:
        image: mongo:7.0.14
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: openvaartha-api
    env:
      MONGODB_URL: mongodb://localhost:27017
      REDIS_URL: redis://localhost:6379/0
      DATABASE_NAME: openvaartha_test
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production-use-000000
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: openvaartha-api/requirements.txt
      - run: pip install -r requirements.txt
      # `integration` tests target a live deployment; they don't belong in CI.
      - run: python -m pytest -m "not integration" -q

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openvaartha-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: openvaartha-web/package-lock.json
      - run: npm ci
      # Typecheck gate. `vite build` does NOT typecheck, which is how an
      # undefined `confirmDelete` and a missing `cn` import reached production.
      # The vendored src/components/animate-ui/ components currently carry ~31
      # pre-existing errors (Headless UI version drift in generated code), so
      # fail on any error OUTSIDE that directory. Once those are regenerated or
      # fixed, drop the filter and gate on tsc's exit code directly.
      - name: Typecheck (app code)
        run: |
          npx tsc --noEmit -p tsconfig.app.json | tee tsc.log || true
          if grep -E "error TS" tsc.log | grep -v "^src/components/animate-ui/"; then
            echo "::error::Type errors in app code (see above)"; exit 1
          fi
      - run: npm test
      - run: npm run build
      # Lint reports pre-existing `no-explicit-any` errors, so it's advisory
      # for now. Remove continue-on-error once those are cleaned up so lint
      # becomes a hard gate.
      - run: npm run lint
        continue-on-error: true

  compose:
    name: Compose config validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        env:
          JWT_SECRET_KEY: ci
          DATABASE_NAME: ci
          MONGODB_URL: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379/0
        run: docker compose config -q
