name: Staging publishing smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    defaults:
      run:
        working-directory: openvaartha-api
    env:
      OPENVAARTHA_BASE_URL: ${{ vars.OPENVAARTHA_BASE_URL }}
      OPENVAARTHA_ADMIN_EMAIL: ${{ secrets.OPENVAARTHA_ADMIN_EMAIL }}
      OPENVAARTHA_ADMIN_PASSWORD: ${{ secrets.OPENVAARTHA_ADMIN_PASSWORD }}
      MONGODB_URL: mongodb://127.0.0.1:27017
      DATABASE_NAME: staging_smoke
      REDIS_URL: redis://127.0.0.1:6379/0
      CACHE_TTL_SECONDS: "0"
      JWT_SECRET_KEY: staging-smoke-local-import-only
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: openvaartha-api/requirements.txt
      - name: Validate staging configuration
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          target = urlsplit(os.environ["OPENVAARTHA_BASE_URL"])
          if (target.scheme != "https" or not target.hostname
              or target.hostname.rstrip(".") in {"openvaartha.com", "www.openvaartha.com"}
              or target.username or target.password or target.path not in {"", "/"}
              or target.query or target.fragment):
              raise SystemExit("Configure a separate HTTPS staging origin.")
          if not all(os.environ.get(key) for key in ("OPENVAARTHA_ADMIN_EMAIL", "OPENVAARTHA_ADMIN_PASSWORD")):
              raise SystemExit("Configure the staging admin credentials.")
          PY
      - run: pip install -r requirements.txt
      - name: Verify release through nginx
        run: >-
          python -m pytest -q
          tests/integration/test_health.py::test_readiness_checks_dependencies
          tests/integration/test_health.py::test_ops_health_requires_admin
          tests/integration/test_admin_cms.py::TestArticleLifecycle::test_full_article_lifecycle
          tests/integration/test_admin_cms.py::test_review_queue_claim_and_archive
