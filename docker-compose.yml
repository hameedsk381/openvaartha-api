x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-OpenVaartha API}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  DEBUG: ${DEBUG:-False}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME is required}
  MONGODB_URL: ${MONGODB_URL:?MONGODB_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  NEWS_API_KEY: ${NEWS_API_KEY:-}
  MEDIASTACK_API_KEY: ${MEDIASTACK_API_KEY:-}
  INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
  INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}

services:
  api:
    build:
      context: .
      dockerfile: openvaartha-api/Dockerfile
    environment: *app-environment
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - openvaartha

  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DATABASE_NAME}
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - openvaartha

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - openvaartha

volumes:
  mongo-data:
  redis-data:

networks:
  openvaartha:
    driver: bridge
