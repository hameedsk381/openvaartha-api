x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-OpenVaartha API}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  DEBUG: ${DEBUG:-False}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME is required}
  MONGODB_URL: ${MONGODB_URL:?MONGODB_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  # Leave blank to reuse REDIS_URL for broker + results (fine for single-DB
  # managed Redis). Set only if your provider offers separate logical DBs.
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
  NEWS_API_KEY: ${NEWS_API_KEY:-}
  MEDIASTACK_API_KEY: ${MEDIASTACK_API_KEY:-}
  INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
  INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
  SITE_URL: ${SITE_URL:-https://openvaartha.com}
  WEB_INDEX_PATH: ${WEB_INDEX_PATH:-/app/web/index.html}
  GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
  GCS_CREDENTIALS_BASE64: ${GCS_CREDENTIALS_BASE64:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@openvaartha.com}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-OpenVaartha}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_CLAIMS_EMAIL: ${VAPID_CLAIMS_EMAIL:-mailto:office@openvaartha.com}


services:
  web:
    build:
      context: ./openvaartha-web
      dockerfile: Dockerfile
      args:
        VITE_GA_TRACKING_ID: ${VITE_GA_TRACKING_ID:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    depends_on:
      - api
    restart: unless-stopped
    command: ["/bin/sh", "-c", "cp /usr/share/nginx/html/index.html /web-shared/index.html && nginx -g 'daemon off;'"]
    volumes:
      - media-data:/usr/share/nginx/html/media
      - web-dist:/web-shared
    networks:
      - dokploy-network

  astro:
    build:
      context: ./openvaartha-astro
      dockerfile: Dockerfile
    environment:
      # Unique alias (not bare "api") — dokploy-network is shared with other
      # apps, so "api" would resolve ambiguously across their services too.
      SITE_API_URL: http://openvaartha-8ud53n-api:8000
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4321/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: openvaartha-api/Dockerfile
    environment: *app-environment
    # MongoDB and Redis are external managed services — compose can't health-gate
    # them, so the app/migrate handle connection retries themselves.
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - media-data:/app/media
      # Read the web build's index.html (published by the web container) so the
      # server-rendered article route can inject into it. WEB_INDEX_PATH points here.
      - web-dist:/app/web:ro
    networks:
      # dokploy-network is shared across every app Dokploy runs, so a bare
      # "api" hostname collides with other apps' services. This unique alias is
      # how web/nginx and astro address the API (see openvaartha-web/nginx.conf).
      dokploy-network:
        aliases:
          - openvaartha-8ud53n-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  # Runs the actual RSS-ingestion + AI-rewrite tasks that app/tasks/rss_generator.py
  # defines. Without this service the beat schedule below never executes anything —
  # it was previously configured in code but had no worker/beat container to run it.
  celery-worker:
    build:
      context: .
      dockerfile: openvaartha-api/Dockerfile
    command: ["celery", "-A", "app.tasks:celery_app", "worker", "--loglevel=info", "--concurrency=2", "--time-limit=300", "--soft-time-limit=270", "--max-tasks-per-child=200"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks:celery_app inspect ping -d celery@$$(hostname) 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

  # Triggers app.tasks.rss_generator.process_all_sources on the beat_schedule
  # defined in app/tasks/__init__.py (every 15 minutes) — the worker above does
  # the actual work, this process only fires the schedule.
  #
  # beat_lock.py guarantees a single scheduler: it acquires a Redis lock before
  # exec'ing celery beat, so a lingering/restarting/scaled beat can't double-fire.
  celery-beat:
    build:
      context: .
      dockerfile: openvaartha-api/Dockerfile
    command: ["python", "-m", "app.tasks.beat_lock", "celery", "-A", "app.tasks:celery_app", "beat", "--loglevel=info"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  # One-shot idempotent bootstrap job (indexes + admin seed + RSS source seed).
  # Runs before api/celery start so replicas never race index creation; exits
  # cleanly after completing. See app/services/migration_service.py.
  migrate:
    build:
      context: .
      dockerfile: openvaartha-api/Dockerfile
    command: ["python", "scripts/migrate.py"]
    environment: *app-environment
    restart: "no"
    networks:
      - dokploy-network

# MongoDB and Redis are external managed services — configured via MONGODB_URL
# and REDIS_URL in .env. They are intentionally not run as containers here.

volumes:
  media-data:
  web-dist:

# dokploy-network is created and managed by Dokploy and shared across all the
# apps it runs — declared external so this stack joins it instead of creating
# its own. The api service takes a unique alias on it (see the api service) to
# avoid hostname collisions with other apps' "api" services.
networks:
  dokploy-network:
    external: true
