services:
  api:
    build:
      context: .
      dockerfile: openvaartha-api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - DATABASE_NAME=openvaartha
      - SECRET_KEY=your-super-secret-key-change-in-production
      - JWT_SECRET_KEY=your-jwt-secret-key-change-in-production
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - mongo
      - redis
    networks:
      - openvaartha-network

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    volumes:
      - mongo-data:/data/db
    networks:
      - openvaartha-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - openvaartha-network

volumes:
  mongo-data:

networks:
  openvaartha-network:
    driver: bridge
