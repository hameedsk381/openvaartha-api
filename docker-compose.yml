x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-OpenVaartha API}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  DEBUG: ${DEBUG:-False}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME is required}
  MONGODB_URL: ${MONGODB_URL:?MONGODB_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
  NEWS_API_KEY: ${NEWS_API_KEY:-}
  MEDIASTACK_API_KEY: ${MEDIASTACK_API_KEY:-}
  INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
  INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
  SITE_URL: ${SITE_URL:-https://openvaartha.com}

services:
  web:
    build:
      context: ./openvaartha-web
      dockerfile: Dockerfile
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - media-data:/usr/share/nginx/html/media
    networks:
      - openvaartha

  api:
    build:
      context: .
      dockerfile: openvaartha-api/Dockerfile
    environment: *app-environment
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - media-data:/app/media
    networks:
      - openvaartha
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Runs the actual RSS-ingestion + AI-rewrite tasks that app/tasks/rss_generator.py
  # defines. Without this service the beat schedule below never executes anything —
  # it was previously configured in code but had no worker/beat container to run it.
  celery-worker:
    build:
      context: .
      dockerfile: openvaartha-api/Dockerfile
    command: ["celery", "-A", "app.tasks:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment: *app-environment
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - openvaartha

  # Triggers app.tasks.rss_generator.process_all_sources on the beat_schedule
  # defined in app/tasks/__init__.py (every 30 minutes) — the worker above does
  # the actual work, this process only fires the schedule.
  celery-beat:
    build:
      context: .
      dockerfile: openvaartha-api/Dockerfile
    command: ["celery", "-A", "app.tasks:celery_app", "beat", "--loglevel=info"]
    environment: *app-environment
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - openvaartha

  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DATABASE_NAME}
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - openvaartha

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - openvaartha

volumes:
  mongo-data:
  redis-data:
  media-data:

networks:
  openvaartha:
    driver: bridge
